name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careerground_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careerground_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerground_test -d careerground_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CAREERGROUND_DATABASE_URL: postgresql+psycopg://careerground_test:ci-only-password@127.0.0.1:5432/careerground_test
      CAREERGROUND_TEST_DATABASE_URL: postgresql+psycopg://careerground_test:ci-only-password@127.0.0.1:5432/careerground_test
      CAREERGROUND_REQUIRE_POSTGRES_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check src migrations tests/test_foundation.py tests/test_postgres_foundation.py tests/test_oauth_metadata_preflight.py
      - run: uv run --locked ruff format --check src migrations tests/test_foundation.py tests/test_postgres_foundation.py tests/test_oauth_metadata_preflight.py
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked python -m unittest discover -s tests -v
