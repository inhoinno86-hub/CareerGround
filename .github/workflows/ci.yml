name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careerground_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careerground_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerground_test -d careerground_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CAREERGROUND_DATABASE_URL: postgresql+psycopg://careerground_test:ci-only-password@127.0.0.1:5432/careerground_test
      CAREERGROUND_TEST_DATABASE_URL: postgresql+psycopg://careerground_test:ci-only-password@127.0.0.1:5432/careerground_test
      CAREERGROUND_REQUIRE_POSTGRES_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check src migrations tests/test_foundation.py tests/test_postgres_foundation.py tests/test_oauth_metadata_preflight.py tests/test_mcp_auth_poc.py tests/test_mcp_product_foundation.py tests/test_deletion_preview.py tests/test_profiling_workspace.py tests/test_profiling_retention.py tests/test_outbox.py tests/test_retention_runner.py tests/test_deletion_execution.py tests/test_restore_quarantine.py tests/test_private_objects.py tests/test_claim_review_workspace.py tests/test_claim_review_submission.py tests/test_claim_use_review.py tests/test_review_presentation_foundation.py tests/test_auth0_review_identity.py tests/test_jd_artifact_foundation.py tests/test_boundary_review.py tests/test_profiling_questions.py tests/test_profiling_protocol_workspace.py tests/test_profiling_draft_extraction.py tests/test_text_journey.py tests/test_adapter_security.py tests/test_request_limit_maintenance.py tests/test_browser_mcp_confirmation.py tests/test_policy_browser_confirmation.py tests/test_artifact_browser_confirmation.py tests/test_local_ingress.py tests/test_deletion_status_capability.py tests/test_local_demo.py tests/test_local_demo_jd.py tests/test_local_demo_deletion.py tests/test_jd_analysis_adapter.py tests/test_synthetic_deletion_journey.py tests/test_postgres_demo_operations.py tests/test_local_mcp_remaining_contracts.py tests/test_text_proposal_validation.py tests/test_development_runtime.py tests/test_contract_completion.py tests/test_resume_r2_review.py tests/test_partial_deletion_journey.py tests/test_deleted_project_scope.py tests/test_postgres_contract_completion.py tests/test_external_gate_preparation.py tests/test_chatgpt_management_journey.py tests/test_chatgpt_plugin_package.py tests/test_chatgpt_synthetic_trial.py tests/test_postgres_account_initialization.py tests/test_identity_only_login.py tests/test_authenticated_management.py tests/test_authenticated_development_store.py tests/test_chatgpt_proposal_review.py tests/test_authenticated_deletion.py tests/test_development_connection_revocations.py tests/test_development_deletion_passkeys.py tests/test_development_connection_controls.py scripts
      - run: uv run --locked ruff format --check src migrations tests/test_foundation.py tests/test_postgres_foundation.py tests/test_oauth_metadata_preflight.py tests/test_mcp_auth_poc.py tests/test_mcp_product_foundation.py tests/test_deletion_preview.py tests/test_profiling_workspace.py tests/test_profiling_retention.py tests/test_outbox.py tests/test_retention_runner.py tests/test_deletion_execution.py tests/test_restore_quarantine.py tests/test_private_objects.py tests/test_claim_review_workspace.py tests/test_claim_review_submission.py tests/test_claim_use_review.py tests/test_review_presentation_foundation.py tests/test_auth0_review_identity.py tests/test_jd_artifact_foundation.py tests/test_boundary_review.py tests/test_profiling_questions.py tests/test_profiling_protocol_workspace.py tests/test_profiling_draft_extraction.py tests/test_text_journey.py tests/test_adapter_security.py tests/test_request_limit_maintenance.py tests/test_browser_mcp_confirmation.py tests/test_policy_browser_confirmation.py tests/test_artifact_browser_confirmation.py tests/test_local_ingress.py tests/test_deletion_status_capability.py tests/test_local_demo.py tests/test_local_demo_jd.py tests/test_local_demo_deletion.py tests/test_jd_analysis_adapter.py tests/test_synthetic_deletion_journey.py tests/test_postgres_demo_operations.py tests/test_local_mcp_remaining_contracts.py tests/test_text_proposal_validation.py tests/test_development_runtime.py tests/test_contract_completion.py tests/test_resume_r2_review.py tests/test_partial_deletion_journey.py tests/test_deleted_project_scope.py tests/test_postgres_contract_completion.py tests/test_external_gate_preparation.py tests/test_chatgpt_management_journey.py tests/test_chatgpt_plugin_package.py tests/test_chatgpt_synthetic_trial.py tests/test_postgres_account_initialization.py tests/test_identity_only_login.py tests/test_authenticated_management.py tests/test_authenticated_development_store.py tests/test_chatgpt_proposal_review.py tests/test_authenticated_deletion.py tests/test_development_connection_revocations.py tests/test_development_deletion_passkeys.py tests/test_development_connection_controls.py scripts
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked playwright install --with-deps chromium firefox
      - run: uv run --locked python scripts/run_local_browser_checks.py --output-dir /tmp/careerground-browser-checks
      - run: uv run --locked python scripts/run_local_browser_checks.py --browser firefox --output-dir /tmp/careerground-firefox-checks
      - run: uv run --locked python scripts/run_local_confirmation_browser_checks.py --output-dir /tmp/careerground-confirmation-chrome
      - run: uv run --locked python scripts/run_local_confirmation_browser_checks.py --browser firefox --output-dir /tmp/careerground-confirmation-firefox
      - run: uv run --locked python scripts/run_local_policy_browser_checks.py --output-dir /tmp/careerground-policy-browser-checks
      - run: uv run --locked python scripts/run_local_artifact_browser_checks.py --output-dir /tmp/careerground-artifact-browser-checks
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils libxtst6
      - run: uv run --locked python scripts/run_local_demo_release_checks.py --output-dir /tmp/careerground-local-demo-release
      - run: uv run --locked python scripts/evaluate_offline_text_proposals.py --output-file /tmp/careerground-offline-text-proposals.json
      - run: uv run --locked python scripts/check_external_gate_preparation.py
      - run: uv run --locked python scripts/run_local_mcp_contract_browser_checks.py --output-dir /tmp/careerground-mcp-contract-browsers
