<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerGround PACE · 실제 Compose 화면</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1e9;color:#243b32;font-family:'Noto Sans CJK KR',sans-serif}main{max-width:1550px;margin:auto;padding:38px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}p{font-size:13px;line-height:1.9;color:#607066}small{font-size:11px;letter-spacing:.7px}nav{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0}button{border:1px solid #cdd8c8;background:transparent;color:#243b32;border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;font-size:12px}button[aria-pressed=true]{background:#264c41;color:white}button:focus-visible{outline:3px solid #42644c;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;margin-top:28px}article{min-width:0}article h2{font-size:16px;font-weight:500}article img{display:block;width:100%;border-radius:21px;box-shadow:0 12px 30px #243b3212}article a{color:inherit;font-size:11px;display:inline-block;margin-top:10px}section.detail{max-width:480px;margin:auto}section.detail img{width:100%;border-radius:22px}section[hidden]{display:none}footer{border-top:1px solid #cdd8c8;margin-top:30px;padding-top:14px}footer p{font-size:11px}a{color:#315e49}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){main{padding:22px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}h1{font-size:24px}}
</style><main><small>CAREERGROUND / PACE COMPOSE</small><h1>선택한 방향을, 실제 화면으로.</h1><p>3차 03 PACE를 Android Compose로 구현했습니다. 아래 이미지는 합성 자료를 사용한 실제 에뮬레이터 화면입니다.</p><nav id="nav"></nav><section id="grid" class="grid"></section><section id="detail" class="detail" hidden></section><footer><p>밝기와 화면을 골라 살펴보세요. 화면 이미지를 누르면 원본 크기로 볼 수 있습니다. 2026-10-12 실제 기능 앱 통합 전의 독립 미리보기 기록입니다.</p><p><a href="README.md">구현·검증·통합 범위</a> · <a href="native-validation.json">화면 검증 기록</a></p></footer></main><script>
const screens=[['home','시작'],['import','자료 가져오기'],['review','내용 검토'],['interview','면접'],['result','결과']];let dark=false,selected='all';const nav=document.querySelector('#nav');function render(){nav.innerHTML=`<button data-screen="all" aria-pressed="${selected==='all'}">전체 보기</button>`+screens.map(([id,label])=>`<button data-screen="${id}" aria-pressed="${selected===id}">${label}</button>`).join('')+`<button data-theme aria-pressed="${dark}">${dark?'밝은 화면 보기':'어두운 화면 보기'}</button>`;const file=id=>`native/${id}-${dark?'dark':'light'}.png`;const grid=document.querySelector('#grid'),detail=document.querySelector('#detail');grid.hidden=selected!=='all';detail.hidden=selected==='all';grid.innerHTML=screens.map(([id,label])=>`<article><h2>${label}</h2><a href="${file(id)}" target="_blank"><img src="${file(id)}" alt="PACE ${label} 실제 Compose 화면"></a><a href="${file(id)}" target="_blank">원본 크게 보기 ↗</a></article>`).join('');if(selected!=='all'){const label=screens.find(([id])=>id===selected)[1];detail.innerHTML=`<h2>${label}</h2><a href="${file(selected)}" target="_blank"><img src="${file(selected)}" alt="PACE ${label} 실제 Compose 화면"></a>`}}nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen)selected=b.dataset.screen;else dark=!dark;render()});render();
</script></html>
